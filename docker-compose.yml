services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: react_frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
